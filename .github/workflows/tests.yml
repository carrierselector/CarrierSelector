name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.14"]
    env:
      PYTHONUTF8: "1"
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Cache Apple carrier catalog
        uses: actions/cache@v4
        with:
          path: embedded_catalog
          key: catalog-${{ hashFiles('tools/fetch_catalog.py') }}

      - name: Install dependencies
        run: python -m pip install -r python_assets/requirements.txt

      - name: Download catalog
        run: python tools/fetch_catalog.py

      - name: Run tests (no iPhone needed)
        run: python -m unittest discover -s tests -v
